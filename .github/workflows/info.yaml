name: informacion

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  revisar-info:
    runs-on: ubuntu-latest

    steps:
      - name: imprimir-informacion
        run: echo "Información del entorno"

      - name: mostrar-informacion
        run: |
          echo "Repositorio: $GITHUB_REPOSITORY"
          echo "Rama: $GITHUB_REF_NAME"
          echo "Autor del commit: $GITHUB_ACTOR"
          echo "SHA: $GITHUB_SHA"
          echo "Numero de commit: $GITHUB_RUN_ID"
          uname -a
    # Ver el username de linux uname -a
    
