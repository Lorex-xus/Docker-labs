name: Buildear Imagen

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  revisar:
    name: Lint 
    runs-on: ubuntu-latest

    steps:
      - name: Importar Chekout
        uses: actions/checkout@v4

      - name: Lint de la receta
        uses: hadolint/hadolint-action@v3.4.0 
        with:
          dockerfile: Dockerfile
          ignore: DL3008, DL4006

  publicar:
    needs: revisar
    name: Iniciar Sesion en GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Iniciar Sesion
        uses: docker/login-action@v3
        with: 
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Importar Chekout
        uses: actions/checkout@v4

      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/lorex-xus/minecraft-server:latest
    
  
