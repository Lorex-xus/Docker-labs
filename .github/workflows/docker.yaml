name: Buildear Imagen

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  revisar:
    name: Lint 
    runs-on: ubuntu-latest

    steps:
      - name: Importar Chekout
        uses: actions/checkout@v4

      - name: Lint de la receta
        uses: hadolint/hadolint-action@v3.4.0 
        with:
          dockerfile: Dockerfile
  
  construir:
    name: Construir Imagen
    needs: revisar
    runs-on: ubuntu-latest

    steps:
      - name: Importar Chekout
        uses: actions/checkout@v4

      - name: Construir
        run: docker build -t imagen/${{github.sha}} .
    
  
