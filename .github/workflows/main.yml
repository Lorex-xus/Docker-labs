name: Buildear Imagen

on:
  workflow_dispatch:
  
permissions:
  contents: read

jobs:
  revisar:
    name: Lint 
    runs-on: ubuntu-latest

    steps:
      - name: Importar Chekout
        uses: actions/checkout@v4

      - name: Lint de la receta
        uses: hadolint/hadolint-action@v3.4.0 
        with:
          dockerfile: Dockerfile
          ignore: DL3008, DL4006
  
  construir:
    needs: revisar
    runs-on: ubuntu-22.04 #Linux

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      
      - name: Construir imagen
        run: docker build -t servidor-minecraft:latest .

      - name: Exportar imagen
        run: docker save servidor-minecraft:latest -o servidor.tar

      - name: Subir imagen
        uses: actions/upload-artifact@v7
        with:
          name: imagen-docker
          path: servidor.tar
          compression-level: 0
         








    
